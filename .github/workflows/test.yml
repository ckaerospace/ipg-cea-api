name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libs for optional CEA
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gfortran libgfortran5
      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib fastapi "uvicorn[standard]" pydantic pytest httpx
          pip install cea || echo "CEA wheel/build failed; live smoke will skip"
      - name: pytest
        env:
          PYTHONPATH: backend
        run: python -m pytest tests -q --tb=short
